name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build DLL and injector
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure CMake for the 32-bit client
        run: cmake -B build -A Win32

      - name: Build Release
        run: cmake --build build --config Release

      - name: Verify build outputs
        shell: pwsh
        run: |
          $files = @(
            "bin/release/WoWControlSDK.dll",
            "bin/release/WowInjector.exe"
          )

          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              Write-Error "Missing build output: $file"
              exit 1
            }
          }

  client:
    name: Build desktop client
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install client and build dependencies
        run: pip install -r requirements-build.txt

      - name: Check that the client compiles
        run: python -m compileall -q tools

      - name: Build the client without a console, as a folder
        run: >
          pyinstaller --noconfirm --clean --windowed --onedir
          --name WoWControlClient --paths tools --collect-data customtkinter --collect-data wowsdk_client
          --distpath dist --workpath build/pyinstaller --specpath build/pyinstaller
          tools/run_client.py

      - name: Verify client output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/WoWControlClient/WoWControlClient.exe")) {
            Write-Error "Missing build output: dist/WoWControlClient/WoWControlClient.exe"
            exit 1
          }

      - name: Upload the client
        uses: actions/upload-artifact@v4
        with:
          name: WoWControlClient
          path: dist/WoWControlClient
          retention-days: 7

  docs:
    name: Validate documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Build both languages with strict checks
        run: mkdocs build --strict
