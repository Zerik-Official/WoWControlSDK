name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the release notes
        shell: pwsh
        run: |
          $notes = "docs/releases/${{ github.ref_name }}.md"
          if (-not (Test-Path $notes)) {
            Write-Error "Missing release notes: $notes"
            exit 1
          }

      - name: Configure CMake for the 32-bit client
        run: cmake -B build -A Win32

      - name: Build Release
        run: cmake --build build --config Release

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install client and build dependencies
        run: pip install -r requirements-build.txt

      - name: Build the client without a console, as a folder
        run: >
          pyinstaller --noconfirm --clean --windowed --onedir
          --name WoWControlClient --paths tools --collect-data customtkinter --collect-data wowsdk_client
          --distpath dist --workpath build/pyinstaller --specpath build/pyinstaller
          tools/run_client.py

      - name: Verify build outputs
        shell: pwsh
        run: |
          $files = @(
            "bin/release/WoWControlSDK.dll",
            "bin/release/WowInjector.exe",
            "dist/WoWControlClient/WoWControlClient.exe",
            "LICENSE"
          )

          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              Write-Error "Missing release file: $file"
              exit 1
            }
          }

      - name: Generate manifest
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $commit = "${{ github.sha }}"

          $artifacts = @{}

          foreach ($file in @(
            "bin/release/WoWControlSDK.dll",
            "bin/release/WowInjector.exe"
          )) {
            $name = Split-Path $file -Leaf
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            $size = (Get-Item $file).Length

            $artifacts[$name] = @{
              sha256 = $hash
              size = $size
            }
          }

          $manifest = @{
            schema_version = 1
            version = $version
            commit = $commit
            artifacts = $artifacts
          }

          $manifest |
            ConvertTo-Json -Depth 5 |
            Set-Content manifest.json -Encoding UTF8

      - name: Create SDK package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $package = "release/WoWControlSDK-$version"

          New-Item -ItemType Directory -Force -Path "$package/binaries" | Out-Null

          Copy-Item "bin/release/WoWControlSDK.dll" "$package/binaries/"
          Copy-Item "bin/release/WowInjector.exe" "$package/binaries/"
          Copy-Item "LICENSE" "$package/"
          Copy-Item "manifest.json" "$package/"

          Compress-Archive `
            -Path $package `
            -DestinationPath "WoWControlSDK-$version.zip"

      - name: Create client package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $package = "release/WoWControlClient-$version"

          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "dist/WoWControlClient/*" $package -Recurse

          New-Item -ItemType Directory -Force -Path "$package/binaries" | Out-Null
          Copy-Item "bin/release/WoWControlSDK.dll" "$package/binaries/"
          Copy-Item "bin/release/WowInjector.exe" "$package/binaries/"
          Copy-Item "LICENSE" "$package/"

          Compress-Archive `
            -Path $package `
            -DestinationPath "WoWControlClient-$version.zip"

      - name: Version without the leading v
        id: version
        shell: pwsh
        run: '"number=$("${{ github.ref_name }}".TrimStart("v"))" >> $env:GITHUB_OUTPUT'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: WoWControlSDK ${{ steps.version.outputs.number }}
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true
          make_latest: true
          files: |
            WoWControlSDK-${{ github.ref_name }}.zip
            WoWControlClient-${{ github.ref_name }}.zip
            manifest.json
